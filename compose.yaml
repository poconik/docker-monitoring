services:
  monitor:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    env_file: .env
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      TELEGRAM_USERS_FILE: /app/data/users.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - monitor-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  monitor-data:
